  <style>
/* ═══ BASE ════════════════════════════════════════════════════════ */
:root{
  --font-display:'Cormorant Garamond','EB Garamond',Georgia,serif;
  --font-body:'Manrope',system-ui,-apple-system,sans-serif;
  --gold:#D4A24C;--gold-deep:#B0823A;--gold-soft:#E8C97A;
  --cream:#FFFBF4;--cream-warm:#FAF1DE;--paper:#FDF8EC;
  --ink:#4A3A2A;--ink-soft:#6A5A48;--ink-faint:#8A7A68;
  --ease:cubic-bezier(.4,.0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;cursor:none !important;}
html,body{margin:0;padding:0;height:100%;background:#FAF1DE;color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;cursor:none;}
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
img,svg{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
button,[role="button"],iframe{pointer-events:auto;}
@media print{body *{visibility:hidden !important;}body::before{content:'Энэхүү шидэт ном нь зөвхөн дижитал хэлбэрээр үзэх боломжтой. amiya publishing · шидэт ном';visibility:visible;position:fixed;inset:0;display:grid;place-items:center;font:13px/1.5 var(--font-body);color:#4A3A2A;background:#fff;}}
#app{position:fixed;inset:0;}

/* ═══ CURSOR TRAIL ════════════════════════════════════════════════ */
#cursor{position:fixed;z-index:99999;width:10px;height:10px;background:rgba(255,255,255,.95);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,220,150,.9),0 0 20px rgba(255,200,100,.5);}
/* Pixie dust particles float UP and fade — not scatter in circles */
.dp{position:fixed;pointer-events:none;border-radius:50%;z-index:99998;animation:dpFade var(--dur,.8s) ease-out forwards;}
@keyframes dpFade{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,-60px))) scale(0);}
}

/* ═══ WORLD ═══════════════════════════════════════════════════════ */
.world{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.scene-layer{position:absolute;inset:0;opacity:0;transition:opacity 1.6s var(--ease);}
.scene-layer.is-active{opacity:1;}
.scene-bg{position:absolute;inset:0;background-size:cover;background-position:center 60%;background-repeat:no-repeat;animation:scene-breathe 30s ease-in-out infinite alternate;}
@keyframes scene-breathe{0%{transform:scale(1) translateY(0);}100%{transform:scale(1.05) translateY(-1.2%);}}
.watercolor-grain{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.85 0 0 0 0 0.70 0 0 0 0.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");mix-blend-mode:soft-light;opacity:0.5;pointer-events:none;}
.night-bg-img{position:absolute;inset:0;background-image:url('assets/world-night.png');background-size:cover;background-position:center 55%;}
.night-aurora{position:absolute;inset:-10%;background:radial-gradient(60% 30% at 30% 25%,rgba(140,120,200,.20),transparent 70%),radial-gradient(50% 28% at 70% 35%,rgba(120,180,200,.16),transparent 70%),radial-gradient(40% 22% at 55% 15%,rgba(180,140,220,.14),transparent 70%);mix-blend-mode:screen;filter:blur(10px);animation:aurora-drift 50s linear infinite;pointer-events:none;}
@keyframes aurora-drift{0%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-2%,1%,0) scale(1.04);}100%{transform:translate3d(0,0,0) scale(1);}}
.night-moon-overlay{position:absolute;top:4%;right:8%;width:160px;height:160px;background:radial-gradient(circle,rgba(255,252,220,.55) 0%,rgba(230,220,255,.25) 40%,transparent 70%);filter:blur(12px);animation:moon-breathe 6s ease-in-out infinite alternate;pointer-events:none;}
@keyframes moon-breathe{0%{opacity:.7;}100%{opacity:1.0;}}
.world-vignette{position:absolute;inset:0;background:radial-gradient(140% 90% at 50% 55%,transparent 30%,rgba(20,10,40,.28) 100%);pointer-events:none;}

/* ── Particles ── */
.world-motes,.world-petals,.world-sunrays,.world-stars,.world-bokeh,.world-fireflies,.world-sparkles,.world-leaves{position:absolute;inset:0;pointer-events:none;}
.mote{position:absolute;border-radius:50%;filter:blur(1px);animation:mote-drift linear infinite;}
@keyframes mote-drift{0%{transform:translate3d(0,20px,0) scale(.5);opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{transform:translate3d(var(--drift),-200px,0) scale(1.2);opacity:0;}}
.world-bokeh-blob{position:absolute;border-radius:50%;filter:blur(22px);opacity:0;animation:bokeh-blob-float ease-in-out infinite;}
@keyframes bokeh-blob-float{0%{opacity:0;transform:translate(0,0) scale(.8);}20%{opacity:var(--bopacity,.4);}80%{opacity:var(--bopacity,.4);}100%{opacity:0;transform:translate(var(--bx,0px),var(--by,-60px)) scale(1.15);}}
.petal{position:absolute;animation:petal-drift linear infinite,petal-rotate linear infinite;filter:drop-shadow(0 1px 3px rgba(120,60,60,.15));}
@keyframes petal-drift{0%{transform:translate3d(0,-20px,0);opacity:0;}8%{opacity:.95;}92%{opacity:.95;}100%{transform:translate3d(var(--drift),130vh,0);opacity:0;}}
@keyframes petal-rotate{0%{rotate:var(--rot-start,0deg);}100%{rotate:calc(var(--rot-start,0deg) + 360deg);}}
.leaf{position:absolute;animation:petal-drift linear infinite,leaf-wobble ease-in-out infinite;}
@keyframes leaf-wobble{0%,100%{rotate:var(--rot-start,0deg);}50%{rotate:calc(var(--rot-start,0deg) + 25deg);}}
.sunray{position:absolute;top:-10%;left:50%;width:220px;height:145%;background:linear-gradient(180deg,rgba(255,240,200,0) 0%,rgba(255,235,200,.22) 40%,rgba(255,235,200,0) 100%);mix-blend-mode:screen;transform:translateX(-50%) rotate(var(--tilt,0deg));transform-origin:50% 0;pointer-events:none;animation:sunray-breathe 18s ease-in-out infinite alternate;}
.sunray-2{width:320px;opacity:.65;animation-duration:24s;}.sunray-3{width:250px;opacity:.45;animation-duration:15s;}.sunray-4{width:180px;opacity:.35;animation-duration:20s;}
@keyframes sunray-breathe{0%{opacity:.4;}100%{opacity:1.0;}}
.day-sparkle{position:absolute;width:var(--ss,6px);height:var(--ss,6px);background:radial-gradient(circle,rgba(255,255,200,1) 0%,rgba(255,240,120,.9) 40%,transparent 100%);border-radius:50%;animation:day-sparkle-anim ease-in-out infinite;box-shadow:0 0 var(--sg,8px) rgba(255,230,80,.9),0 0 calc(var(--sg,8px) * 2) rgba(255,210,0,.4);}
@keyframes day-sparkle-anim{0%,100%{opacity:0;transform:scale(.15);}45%,55%{opacity:1;transform:scale(1);}}
/* Twinkle stars — two layers: sharp tiny + larger soft */
.twinkle-star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.9),0 0 10px rgba(220,220,255,.5);animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.4);}50%{opacity:1;transform:scale(1);}}
.twinkle-star-soft{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,240,.9) 0%,rgba(220,230,255,.3) 50%,transparent 100%);animation:twinkle-soft ease-in-out infinite;}
@keyframes twinkle-soft{0%,100%{opacity:.1;transform:scale(.5);}50%{opacity:.7;transform:scale(1.1);}}
/* Fireflies — larger, more distinct */
.firefly-pulse{position:absolute;border-radius:50%;animation:firefly-drift ease-in-out infinite alternate,firefly-glow ease-in-out infinite;}
@keyframes firefly-drift{0%{transform:translate3d(0,0,0);}100%{transform:translate3d(var(--fx,40px),var(--fy,-25px),0);}}
@keyframes firefly-glow{0%,100%{opacity:.1;box-shadow:0 0 4px currentColor;}40%{opacity:.95;box-shadow:0 0 12px currentColor,0 0 24px currentColor,0 0 40px currentColor;}60%{opacity:.95;}}
/* Night bokeh */
.night-bokeh{position:absolute;border-radius:50%;filter:blur(28px);animation:night-bokeh-drift ease-in-out infinite alternate;pointer-events:none;}
@keyframes night-bokeh-drift{0%{opacity:.25;transform:translate(0,0) scale(1);}100%{opacity:.5;transform:translate(var(--bx,12px),var(--by,-8px)) scale(1.1);}}
/* Night sparkles */
.night-sparkle{position:absolute;background:radial-gradient(circle,rgba(255,255,255,.98) 0%,rgba(200,220,255,.5) 60%,transparent 100%);border-radius:50%;animation:night-sparkle-anim ease-in-out infinite;box-shadow:0 0 6px rgba(200,220,255,.8),0 0 14px rgba(180,200,255,.4);}
@keyframes night-sparkle-anim{0%,100%{opacity:0;transform:scale(0);}40%,60%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(0);}}

/* ═══ FLOATING HEARTS (farewell — on ‌-prefixed name spans) ══════ */
.heart-anchor{
  position:relative;
  display:inline-block;
  overflow:visible;   /* hearts must escape the text bounds upward */
}
.floating-heart{
  position:absolute;
  pointer-events:none;
  font-style:normal;
  line-height:1;
  animation:heart-float var(--hd,2.4s) ease-out var(--hdelay,0s) infinite;
  opacity:0;
  z-index:10;
  user-select:none;
  will-change:transform,opacity;
}
@keyframes heart-float{
  0%  {opacity:0; transform:translate(var(--hx,0px),0px) scale(.4);}
  18% {opacity:1;}
  75% {opacity:.8;}
  100%{opacity:0; transform:translate(var(--hx,0px),var(--hy,-55px)) scale(.15);}
}

/* ═══ BOOK FRAME ══════════════════════════════════════════════════ */
.book-frame{position:fixed;inset:0;display:grid;place-items:center;z-index:2;opacity:0;transition:opacity 1.4s var(--ease-out);padding:clamp(20px,4vh,60px) clamp(20px,4vw,60px);padding-bottom:clamp(60px,9vh,100px);}
.book-frame.is-visible{opacity:1;}
.book-frame-inner{position:relative;width:min(88vw,1160px);aspect-ratio:2/1;max-height:calc(100vh - 140px);filter:drop-shadow(0 1px 3px rgba(30,15,0,.30)) drop-shadow(0 6px 16px rgba(50,25,5,.32)) drop-shadow(0 22px 44px rgba(30,12,0,.32)) drop-shadow(0 44px 70px rgba(15,8,0,.20));}
.book-iframe{width:100%;height:100%;border:0;border-radius:6px;background:transparent;display:block;}
.frame-corner{position:absolute;width:36px;height:36px;pointer-events:none;opacity:.85;}.corner-flourish{width:100%;height:100%;}
.frame-corner-tl{top:-18px;left:-18px;}.frame-corner-tr{top:-18px;right:-18px;transform:scaleX(-1);}
.frame-corner-bl{bottom:-18px;left:-18px;transform:scaleY(-1);}.frame-corner-br{bottom:-18px;right:-18px;transform:scale(-1,-1);}

/* ═══ SIGNATURE ══════════════════════════════════════════════════ */
.signature{position:fixed;left:0;right:0;bottom:16px;text-align:center;z-index:3;opacity:0;transition:opacity 1s var(--ease-out) .6s;pointer-events:none;}
.signature.is-visible{opacity:1;}
.signature-line{display:inline-flex;align-items:baseline;gap:10px;padding:6px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;}
.signature-mark{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:16px;letter-spacing:.04em;text-transform:none;color:var(--gold-deep);}
.signature-dot{opacity:.4;}.signature-for,.signature-from{letter-spacing:.16em;font-size:10.5px;}

/* ═══ CONTROLS ════════════════════════════════════════════════════ */
.audio-toggle,.replay-btn{position:fixed;z-index:5;appearance:none;border:.5px solid rgba(120,90,40,.25);background:rgba(255,251,244,.7);color:var(--ink-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;cursor:none;transition:all .3s var(--ease);font-family:var(--font-body);}
.audio-toggle:hover,.replay-btn:hover{border-color:rgba(120,90,40,.5);background:rgba(255,251,244,.9);color:var(--gold-deep);}
.audio-toggle{right:20px;bottom:20px;width:38px;height:38px;padding:9px;}.audio-toggle svg{width:100%;height:100%;}
.audio-toggle.is-muted{color:var(--ink-faint);opacity:.7;}
.replay-btn{left:20px;bottom:20px;height:38px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.06em;opacity:0;transform:translateY(8px);pointer-events:none;}
.replay-btn.is-visible{opacity:1;transform:translateY(0);pointer-events:auto;transition-delay:.8s;}
.replay-btn svg{width:16px;height:16px;flex-shrink:0;}

/* ═══ START GATE ══════════════════════════════════════════════════ */
.start-gate{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 100% at 50% 50%,#FFFBF0 0%,#FCEFD8 60%,#F5DCC0 100%);display:grid;place-items:center;cursor:none;animation:gate-fade-in 1.2s var(--ease);overflow:hidden;}
.start-gate:focus{outline:none;}
@keyframes gate-fade-in{from{opacity:0;}to{opacity:1;}}
.start-gate::before,.start-gate::after{content:'';position:absolute;width:80vmin;height:80vmin;border-radius:50%;pointer-events:none;filter:blur(30px);animation:gate-bokeh 18s ease-in-out infinite alternate;}
.start-gate::before{top:-20%;left:-10%;background:radial-gradient(circle,rgba(245,197,197,.55) 0%,transparent 60%);}
.start-gate::after{bottom:-25%;right:-15%;background:radial-gradient(circle,rgba(181,212,232,.45) 0%,transparent 60%);animation-direction:alternate-reverse;}
@keyframes gate-bokeh{0%{transform:translate3d(0,0,0);opacity:.8;}100%{transform:translate3d(3%,-2%,0);opacity:1;}}
.start-gate-glow{position:absolute;width:60vmin;height:60vmin;background:radial-gradient(circle,rgba(255,240,200,.7) 0%,rgba(255,220,160,.25) 30%,transparent 65%);animation:gate-glow-pulse 5s ease-in-out infinite;pointer-events:none;}
@keyframes gate-glow-pulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:.9;transform:scale(1.08);}}
.start-gate-content{position:relative;text-align:center;color:var(--ink);animation:gate-content-rise 1.6s var(--ease-out) .3s both;padding:0 20px;}
@keyframes gate-content-rise{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.start-gate-eyebrow{font-size:13px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:32px;font-weight:500;}
.start-gate-name{font-family:var(--font-display);font-size:clamp(72px,14vw,168px);font-weight:400;line-height:1;color:var(--gold-deep);margin:0;text-shadow:0 0 60px rgba(212,162,76,.3);letter-spacing:-.01em;}
.start-gate-rule{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto;}
.start-gate-from{font-size:17px;letter-spacing:.16em;color:var(--ink-soft);font-style:italic;font-family:var(--font-display);}
.start-gate-cta{margin-top:56px;display:inline-flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);animation:gate-cta-breathe 2.6s ease-in-out infinite;}
.start-gate-cta-icon{color:var(--gold);font-size:13px;}
@keyframes gate-cta-breathe{0%,100%{opacity:.45;}50%{opacity:1;}}

/* ═══ INTRO ═══════════════════════════════════════════════════════ */
.intro{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
.intro-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1s var(--ease-out);}
.intro-title.is-visible{opacity:1;}
.intro-title-eyebrow{font-size:13px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:24px;}
.intro-title-name{font-family:var(--font-display);font-size:clamp(68px,13vw,148px);color:var(--gold-deep);text-shadow:0 0 40px rgba(212,162,76,.4);line-height:1;letter-spacing:-.01em;}
.intro-title-rule{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto;}
.intro-title-from{font-size:16px;letter-spacing:.16em;color:var(--ink-soft);font-style:italic;font-family:var(--font-display);}
.intro-mist{position:absolute;inset:0;background:linear-gradient(180deg,#FFFBF0 0%,#FCEFD8 60%,#F5DCC0 100%);transition:opacity 1.2s var(--ease);}
.intro-bloom.phase-4 .intro-mist{opacity:0;}
.intro-bokeh{position:absolute;inset:0;pointer-events:none;transition:opacity .8s var(--ease);}
.intro-bloom.phase-4 .intro-bokeh{opacity:0;}
.bokeh-dot{position:absolute;border-radius:50%;animation:bokeh-drift linear infinite;}
@keyframes bokeh-drift{0%{transform:translate3d(0,0,0) scale(.7);opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{transform:translate3d(20px,-40px,0) scale(1);opacity:0;}}
.intro-bloom-burst{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,240,.95) 0%,rgba(255,240,200,.55) 30%,rgba(255,220,170,0) 70%);filter:blur(8px);opacity:0;transform:translate(-50%,-50%);transition:all 1.2s var(--ease-out);}
.intro-bloom.phase-3 .intro-bloom-burst,.intro-bloom.phase-4 .intro-bloom-burst{opacity:1;width:200vmax;height:200vmax;}
.intro-sky{position:absolute;inset:0;background:linear-gradient(180deg,#C8E0F0 0%,#F5D8E0 40%,#FCE8C8 70%,#F5C898 100%);transition:opacity 1s var(--ease);}
.intro-sunrise.phase-5 .intro-sky{opacity:0;}
.intro-horizon{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(200,220,170,.4) 0%,rgba(180,200,150,.7) 100%);filter:blur(6px);transition:opacity 1s var(--ease);}
.intro-sunrise.phase-5 .intro-horizon{opacity:0;}
.intro-sun{position:absolute;left:50%;bottom:12%;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,220,1) 0%,rgba(255,230,180,.95) 30%,rgba(255,200,150,.6) 50%,rgba(255,180,130,0) 75%);transform:translateY(60%);opacity:0;transition:all 2s var(--ease-out);filter:blur(2px);}
.intro-sunrise.phase-1 .intro-sun{opacity:.7;transform:translateY(50%);}
.intro-sunrise.phase-2 .intro-sun,.intro-sunrise.phase-3 .intro-sun{opacity:1;transform:translateY(20%);}
.intro-sunrise.phase-4 .intro-sun{opacity:1;transform:translateY(-10%) scale(1.3);}
.intro-sunrise.phase-5 .intro-sun{opacity:0;transform:translateY(-30%) scale(3);}
.intro-cream-bg{position:absolute;inset:0;background:linear-gradient(180deg,#FFFBF0 0%,#FCEFD8 60%,#F5DCC0 100%);transition:opacity 1s var(--ease);}
.intro-petals.phase-4 .intro-cream-bg{opacity:0;}
.petal-swirl{position:absolute;inset:0;pointer-events:none;}
.swirl-petal{position:absolute;opacity:0;transform:translate(0,0) rotate(var(--rot));filter:drop-shadow(0 2px 4px rgba(150,80,80,.2));}
.intro-petals.phase-1 .swirl-petal{opacity:.95;transform:translate(var(--end-x),var(--end-y)) rotate(calc(var(--rot) + 200deg));transition:transform 1.8s var(--ease-out),opacity .4s ease;}
.intro-petals.phase-2 .swirl-petal,.intro-petals.phase-3 .swirl-petal{opacity:.95;transform:translate(var(--end-x),var(--end-y)) rotate(calc(var(--rot) + 200deg));transition:transform 1.8s var(--ease-out),opacity .4s ease;}
.intro-petals.phase-4 .swirl-petal{opacity:0;transform:translate(var(--disperse-x),var(--disperse-y)) rotate(calc(var(--rot) + 500deg));transition:transform 1.2s var(--ease-out),opacity 1.1s var(--ease-out);}

/* ═══ SCENE NAVIGATOR ══════════════════════════════════════════════ */

  <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Mobile detection — used to scale down particle counts only ──
// Checks touch support + screen width. Never changes after mount.
const isMobile = (
  ('ontouchstart' in window || navigator.maxTouchPoints > 0) &&
  window.innerWidth < 1024
);
// Particle scale: 1.0 on desktop, 0.45 on mobile
const PS = isMobile ? 0.45 : 1.0;
// Helper: scale a particle count, minimum 2
const pc = (n) => Math.max(2, Math.round(n * PS));

// ═══════════════════════════════════════════════════════════════
//  GITHUB LETTER LIBRARY
// ═══════════════════════════════════════════════════════════════
const GITHUB_LETTERS = 'https://raw.githubusercontent.com/msangibat-sketch/Magic-book-letters/main';

// Mongolian Cyrillic → Latin filename key
const CYRILLIC_MAP = {
  'А':'a','Б':'b','В':'v','Г':'g','Д':'d','Е':'ye','Ё':'yo','Ж':'j',
  'З':'z','И':'i','Й':'iy','К':'k','Л':'l','М':'m','Н':'n','О':'o',
  'Ө':'q','П':'p','Р':'r','С':'s','Т':'t','У':'u','Ү':'w','Ф':'f',
  'Х':'kh','Ц':'ts','Ч':'ch','Ш':'sh','Щ':'sch','Ь':',','Э':'e',
  'Ю':'yu','Я':'ya',
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'ye','ё':'yo','ж':'j',
  'з':'z','и':'i','й':'iy','к':'k','л':'l','м':'m','н':'n','о':'o',
  'ө':'q','п':'p','р':'r','с':'s','т':'t','у':'u','ү':'w','ф':'f',
  'х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ь':',','э':'e',
  'ю':'yu','я':'ya',
  '-':'hyphen',
};

// Build letter slots for a name, hyphen-aware.
// Returns one { url, isCapital, isHyphen } per character — hyphens included as their own slot.
// - First letter of the name → isCapital:true → fetches -u illustration, renders at 1.8×
// - Hyphen → isHyphen:true, isCapital:false → fetches hyphen-1-u.png, renders at 0.5× width
// - Letter immediately after a hyphen → isCapital:true (uppercase illustration + 1.8× size)
// - All other letters → isCapital:false → fetches -l illustration, normal width
// - Uppercase and lowercase counters are SEPARATE: Э counts e-u independently from э counting e-l
//   e.g. Энх-Эрдэнэ → e-1-u, e-2-u, e-1-l, e-2-l (not e-1-u, e-2-u, e-3-l, e-4-l)
// - variantOverrides: per-suffix overrides e.g. { 'e-u': [1,3], 'e-l': [2,4], 'kh-l': 2 }
//   Sequence mode (array): exact variant per occurrence, last repeats if exhausted
//   Offset mode (number): start at this variant, count up — stored as (desired-1) internally
function buildLetterUrls(name, variantOverrides={}) {
  // Separate counters for uppercase (key-u) and lowercase (key-l)
  const usageCounts = {};
  // Pre-seed offset-mode overrides
  Object.entries(variantOverrides).forEach(([k, val]) => {
    if (!Array.isArray(val)) usageCounts[k] = val;
  });
  let nextIsCapital = true;
  return name.split('').map(char => {
    const isHyphen = char === '-';
    if (isHyphen) {
      nextIsCapital = true;
      const u = `${GITHUB_LETTERS}/hyphen-1-u.png`;
      return { url: u, urls: [u], isCapital: false, isHyphen: true, char };
    }
    const key = CYRILLIC_MAP[char] || CYRILLIC_MAP[char.toLowerCase()];
    const isCapital = nextIsCapital;
    nextIsCapital = false;
    if (!key) return { url: null, urls: [], isCapital, isHyphen: false, char };
    const suffix = isCapital ? 'u' : 'l';
    const countKey = `${key}-${suffix}`;  // e.g. 'e-u' or 'e-l' — separate counters
    usageCounts[countKey] = (usageCounts[countKey] || 0) + 1;
    const occurrenceIdx = usageCounts[countKey] - 1;
    const seq = variantOverrides[countKey];
    const variant = Array.isArray(seq)
      ? seq[Math.min(occurrenceIdx, seq.length - 1)]
      : usageCounts[countKey];
    // Fallback order when a file doesn't exist in the repo:
    //   1. this variant, this case          e.g. e-4-u
    //   2. this variant, the other case     e-4-l   (uppercase not drawn → use lowercase art)
    //   3. variant 1, this case             e-1-u   (variant number doesn't exist at all)
    //   4. variant 1, the other case        e-1-l
    // The letter keeps its capital/lowercase SIZE whichever file is used.
    const other = isCapital ? 'l' : 'u';
    const urls = [...new Set([
      `${GITHUB_LETTERS}/${key}-${variant}-${suffix}.png`,
      `${GITHUB_LETTERS}/${key}-${variant}-${other}.png`,
      `${GITHUB_LETTERS}/${key}-1-${suffix}.png`,
      `${GITHUB_LETTERS}/${key}-1-${other}.png`,
    ])];
    return { url: urls[0], urls, isCapital, isHyphen: false, char };
  });
}
// ═══════════════════════════════════════════════════════════════
//  LETTER SIZING — the PNGs can be any size; the code measures them
// ═══════════════════════════════════════════════════════════════
//  Each PNG is read once (pixels) to find:
//    • the GLYPH box   — the illustrated letter itself, ignoring empty padding
//    • the THREAD      — its x position, top end, thickness and colour
//  All sizing is then based on the glyph's HEIGHT, so it no longer matters
//  what canvas size, resolution, padding or thread length a PNG was exported with.
//
//  Tune the look here:
const LETTER_LAYOUT = {
  lowerRatio:  1 / 1.8, // lowercase glyph height ÷ capital glyph height (1/1.8 = previous look)
  hyphenRatio: 0.38,    // hyphen glyph height ÷ lowercase glyph height
  hyphenLift:  0.30,    // hyphen raised off the baseline, × lowercase glyph height
  gapRatio:    0.24,    // space between letters, × lowercase glyph height
  fillWidth:   0.92,    // max share of the screen width the whole name may use
  fillHeight:  0.72,    // capital glyph height ≤ this share of the letter-row height
  maxCapPx:    300,     // never draw a capital glyph taller than this
  swayTravel:  0.45,    // how far a letter may swing sideways, × the gap (keeps neighbours apart)
  threadForHyphen: true // draw a thread for pieces that have none baked in (the hyphen)
};

const LETTER_METRICS = new Map(); // url → Promise<metrics|null>

// Accepts one URL or a list of candidates; the first that loads wins.
// Resolves to the measurements plus `src` (the file actually used), or null if none load.
function analyzeLetter(urls) {
  const list = (Array.isArray(urls) ? urls : [urls]).filter(Boolean);
  if (!list.length) return Promise.resolve(null);
  const cacheKey = list.join('|');
  if (LETTER_METRICS.has(cacheKey)) return LETTER_METRICS.get(cacheKey);
  const load = i => i >= list.length ? Promise.resolve(null) : new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';           // raw.githubusercontent.com allows this
    img.onload  = () => resolve({ ...measureLetter(img), src: list[i] });
    img.onerror = () => resolve(load(i + 1)); // missing file → try the next candidate
    img.src = list[i];
  });
  const p = load(0);
  LETTER_METRICS.set(cacheKey, p);
  return p;
}

function measureLetter(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  // Fallback if pixels can't be read: assume the old layout (glyph is a square at the bottom)
  const fallback = {
    w: W, h: H, gx0: 0, gx1: W, gy0: Math.max(0, H - W), gy1: H,
    threadX: W / 2, threadTop: H > W * 1.5 ? 0 : null, threadW: Math.max(1, W * 0.02),
    threadColor: 'rgba(255,255,255,.85)',
  };
  try {
    const k = Math.min(1, 1400 / Math.max(W, H));  // analyse at most ~1400px
    const cw = Math.max(1, Math.round(W * k)), ch = Math.max(1, Math.round(H * k));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, cw, ch);
    const px = ctx.getImageData(0, 0, cw, ch).data;
    const A = 28; // alpha threshold for "something is here"

    // Per-row: opaque count, left-most and right-most opaque pixel
    const cnt = new Int32Array(ch), minX = new Int32Array(ch).fill(-1), maxX = new Int32Array(ch).fill(-1);
    for (let y = 0; y < ch; y++) {
      let c = 0, lo = -1, hi = -1, o = y * cw * 4 + 3;
      for (let x = 0; x < cw; x++, o += 4) if (px[o] > A) { c++; if (lo < 0) lo = x; hi = x; }
      cnt[y] = c; minX[y] = lo; maxX[y] = hi;
    }
    let top = 0; while (top < ch && cnt[top] === 0) top++;
    let bot = ch - 1; while (bot > 0 && cnt[bot] === 0) bot--;
    if (top >= bot) return fallback;

    // A "thread row" is a narrow sliver; the glyph starts at the first run of wide rows
    const thin = Math.max(2, cw * 0.045);
    const isThread = y => cnt[y] > 0 && (maxX[y] - minX[y] + 1) <= thin;
    const run = Math.max(2, Math.round(ch * 0.012));
    let gy0 = top;
    if (isThread(top)) {
      for (let y = top; y <= bot; y++) {
        let wide = true;
        for (let j = 0; j < run && y + j <= bot; j++) if (isThread(y + j) || cnt[y + j] === 0) { wide = false; break; }
        if (wide) { gy0 = y; break; }
      }
    }
    // Glyph horizontal extent
    let gx0 = cw, gx1 = 0;
    for (let y = gy0; y <= bot; y++) if (cnt[y]) { gx0 = Math.min(gx0, minX[y]); gx1 = Math.max(gx1, maxX[y]); }

    // Thread: x, thickness and colour from the rows just above the glyph
    let threadTop = null, threadX = (gx0 + gx1 + 1) / 2, threadW = Math.max(1, cw * 0.015), color = null;
    if (gy0 > top) {
      threadTop = top;
      const from = Math.max(top, gy0 - Math.round(ch * 0.15));
      let sx = 0, sw = 0, n = 0, r = 0, g = 0, b = 0, a = 0, m = 0;
      for (let y = from; y < gy0; y++) {
        if (!cnt[y]) continue;
        sx += (minX[y] + maxX[y] + 1) / 2; sw += (maxX[y] - minX[y] + 1); n++;
        for (let x = minX[y]; x <= maxX[y]; x++) {
          const o = (y * cw + x) * 4; if (px[o + 3] <= A) continue;
          r += px[o]; g += px[o + 1]; b += px[o + 2]; a += px[o + 3]; m++;
        }
      }
      if (n) { threadX = sx / n; threadW = sw / n; }
      if (m) color = `rgba(${Math.round(r/m)},${Math.round(g/m)},${Math.round(b/m)},${(a/m/255).toFixed(2)})`;
    }
    const s = 1 / k; // back to original PNG pixels
    return {
      w: W, h: H,
      gx0: gx0 * s, gx1: (gx1 + 1) * s, gy0: gy0 * s, gy1: (bot + 1) * s,
      threadX: threadX * s, threadTop: threadTop === null ? null : threadTop * s,
      threadW: threadW * s, threadColor: color || 'rgba(255,255,255,.85)',
    };
  } catch (e) {
    return fallback; // e.g. canvas blocked by CORS
  }
}

// Turns measured letters + available space into exact pixel sizes.
// Everything scales together: if the name is too wide, all letters shrink equally.
function layoutLetters(slots, metrics, availW, rowH) {
  const L = LETTER_LAYOUT;
  const rel = slots.map((slot, i) => {
    const m = metrics[i];
    const gw = m ? m.gx1 - m.gx0 : 1, gh = m ? m.gy1 - m.gy0 : 1;
    const hUnit = slot.isHyphen ? L.lowerRatio * L.hyphenRatio : slot.isCapital ? 1 : L.lowerRatio;
    return { m, gw, gh, hUnit, wUnit: hUnit * (gw / gh) };
  });
  const gapUnit = L.gapRatio * L.lowerRatio;
  const totalUnits = rel.reduce((t, r) => t + r.wUnit, 0) + gapUnit * Math.max(0, rel.length - 1);
  const capH = Math.max(8, Math.min(
    (availW * L.fillWidth) / Math.max(totalUnits, 0.001),
    rowH * L.fillHeight,
    L.maxCapPx,
  ));
  const lowerH = capH * L.lowerRatio;
  return {
    gap: gapUnit * capH,
    items: rel.map((r, i) => {
      const slot = slots[i], m = r.m;
      const glyphH = r.hUnit * capH;
      const sc = glyphH / r.gh;        // PNG pixels → screen pixels for this letter
      const glyphW = r.gw * sc;
      const lift = slot.isHyphen ? lowerH * L.hyphenLift : 0;
      // Pivot = top of the screen, straight above the thread. Limit the swing angle so
      // the letter's bottom never travels more than a fraction of the gap sideways.
      const pivotY = -(rowH - glyphH - lift);                 // relative to the slot's top
      const reach = Math.max(1, rowH - lift);                 // pivot → bottom of glyph
      const maxAmpDeg = Math.atan(Math.max(2, gapUnit * capH * L.swayTravel) / reach) * 180 / Math.PI;
      const item = { glyphW, glyphH, lift, pivotY, maxAmpDeg, ok: !!m };
      if (!m) return { ...item, threadX: glyphW / 2 };
      item.img = { src: m.src, w: m.w * sc, h: m.h * sc, left: -m.gx0 * sc, top: -m.gy0 * sc };
      item.threadX = (m.threadX - m.gx0) * sc;
      if (m.threadTop !== null) {
        item.thread = { x: item.threadX, w: Math.max(1, m.threadW * sc), bottom: (m.threadTop - m.gy0) * sc + 1, color: m.threadColor };
      } else if (slot.isHyphen && L.threadForHyphen) {
        item.thread = { x: item.threadX, w: Math.max(1, lowerH * 0.018), bottom: 2, color: 'rgba(255,255,255,.85)' };
      }
      return item;
    }),
  };
}

const CONFIG = {
  bookId:           '9ede2e545d',
  // To enable floating hearts on farewell page, prefix childName with \u200C:
  //   childName: '\u200CТогтуун'   ← hearts float from name in poem
  //   childName: 'Тогтуун'         ← no hearts
  childName:        '\u200CАмияа',
  fromName:         '',
  animalName:       'Цагаан баавгай',
  intro:            'bloom',
  defaultScene:     'morning',
  continueDelaySec: 30,
  // gender: 'girl' or 'boy' — controls sleeping image, animal image, poem word
  // Override via ?gender=girl or ?gender=boy in URL
  gender:           'girl',
};

// Strips \u200C trigger for use in display contexts outside farewell poem
const HEART_TRIGGER_CHAR = '\u200C';
function cleanName(n){ return n ? n.replace(HEART_TRIGGER_CHAR,'') : n; }

function useConfig() {
  return useMemo(()=>{
    const p=new URLSearchParams(location.search);
    const rawName = p.get('name') !== null ? p.get('name') : CONFIG.childName;
    // Use ?? so an explicit ?from= value (even empty) is respected; fall back to CONFIG only if param absent
    const rawFrom = p.get('from') !== null ? decodeURIComponent(p.get('from')) : CONFIG.fromName;
    // hearts=1 param activates floating hearts — cleaner than \u200C in URL
    const heartsParam = p.get('hearts') === '1';
    // Also support \u200C prefix in name for backwards compat
    const nameHasPrefix = rawName.startsWith('\u200C');
    const showHearts = heartsParam || nameHasPrefix;
    // Clean name for display (strip \u200C if present)
    const cleanedName = nameHasPrefix ? rawName.slice(1) : rawName;
    // Prepend \u200C internally if hearts requested via param
    const childName = showHearts
      ? (nameHasPrefix ? rawName : '\u200C' + cleanedName)
      : cleanedName;
    // Parse variants param — format: key:value, comma-separated
    //   key can be:
    //     e        → applies to BOTH e-u and e-l
    //     e-u      → uppercase only (capital letters)
    //     e-l      → lowercase only
    //   value can be:
    //     2        → start at variant 2, count up (offset mode)
    //     1.3.2.4  → exact sequence per occurrence, last repeats if exhausted (sequence mode)
    // Examples: e:1.3.2.4   e-u:1.2   e-l:3.1   kh:2   e-u:1,e-l:2.3
    const variantsRaw = p.get('variants') || '';
    const variantOverrides = {};
    if (variantsRaw) {
      variantsRaw.split(',').forEach(part => {
        const colonIdx = part.indexOf(':');
        if (colonIdx === -1) return;
        const key = part.slice(0, colonIdx).trim();
        const val = part.slice(colonIdx + 1).trim();
        if (!key || !val) return;
        const parsed = val.includes('.')
          ? val.split('.').map(v => parseInt(v, 10)).filter(n => !isNaN(n))
          : (!isNaN(val) ? parseInt(val, 10) - 1 : null);
        if (parsed === null) return;
        // Plain key (e.g. 'e') expands to both 'e-u' and 'e-l'
        if (!key.endsWith('-u') && !key.endsWith('-l')) {
          variantOverrides[key + '-u'] = Array.isArray(parsed) ? [...parsed] : parsed;
          variantOverrides[key + '-l'] = Array.isArray(parsed) ? [...parsed] : parsed;
        } else {
          variantOverrides[key] = parsed;
        }
      });
    }
    return {
      bookId:       p.get('book')    || CONFIG.bookId,
      childName,
      fromName:     rawFrom,
      animalName:   p.get('animal')  || CONFIG.animalName,
      intro:        p.get('intro')   || CONFIG.intro,
      gender:       p.get('gender')  || CONFIG.gender,
      nameArt:      p.get('nameArt') || CONFIG.nameArt,
      sceneOverride:p.get('scene')   || null,
      variantOverrides,
    };
  },[]);
}

//  PIXIE DUST EXPLOSION (Дуусгах) — floats UP in colorful waves
// ═══════════════════════════════════════════════════════════════
function spawnPixieDust(originX, originY, onDone) {
  const root = document.getElementById('orb-root');
  root.innerHTML = '';
  root.style.cssText = 'position:fixed;inset:0;z-index:201;pointer-events:none;overflow:hidden;';

  const COLORS = [
    '#FFD700','#FFB6C1','#E6E6FA','#FFF0CC','#B0E0FF',
    '#FFDAB9','#fff','#C8A0FF','#FFE4B5','#a8edea',
    '#fed6e3','#FFFACD','#98FB98','#FFB347','#DDA0DD',
    '#87CEEB','#FFC0CB','#FFEFD5','#E0FFFF','#FFD1DC',
  ];

  const TOTAL = 500;
  const WAVES = 6;

  for (let w = 0; w < WAVES; w++) {
    const perWave = Math.floor(TOTAL / WAVES);
    for (let i = 0; i < perWave; i++) {
      const p = document.createElement('div');
      p.className = 'dp';

      const sz = Math.random() * 10 + 2;
      const col = COLORS[Math.floor(Math.random() * COLORS.length)];
      // Float mostly upward with horizontal scatter — like embers rising
      const dx = (Math.random() - 0.5) * 280;           // wide horizontal spread
      const dy = -(80 + Math.random() * (window.innerHeight * 0.85)); // mostly UP
      const dur = 0.7 + Math.random() * 1.4;
      const delay = w * 0.1 + Math.random() * 0.15;

      p.style.cssText = `
        left:${originX}px;
        top:${originY}px;
        width:${sz}px;
        height:${sz}px;
        background:${col};
        --dx:${dx}px;
        --dy:${dy}px;
        --dur:${dur}s;
        box-shadow:0 0 ${sz * 2.5}px ${col}, 0 0 ${sz * 5}px ${col}88;
        animation-delay:${delay}s;
      `;
      root.appendChild(p);
      setTimeout(() => p.remove(), (dur + delay) * 1000 + 200);
    }
  }

  const maxTime = (WAVES * 0.1 + 0.15 + 0.7 + 1.4) * 1000 + 900;
  setTimeout(() => { root.innerHTML = ''; onDone(); }, maxTime);
}

function Motes({ count=20, hue=45, opacity=.5, hues=null }) {
  const motes = useMemo(()=>[...Array(count)].map((_,i)=>{
    const seed=(i*9301+49297)%233280, r=n=>((seed*n)%1000)/1000;
    const h=hues?hues[i%hues.length]:hue;
    return{id:i,x:r(3)*100,y:20+r(5)*75,size:3+r(7)*12,dur:18+r(11)*20,delay:r(13)*25,drift:-40+r(17)*80,hue:h,sat:70+r(19)*25,lit:82+r(23)*14};
  }),[count,hue]);
  return(
    <div className="world-motes" aria-hidden="true">
      {motes.map(m=>(
        <span key={m.id} className="mote" style={{left:`${m.x}%`,top:`${m.y}%`,width:`${m.size}px`,height:`${m.size}px`,background:`radial-gradient(circle,hsla(${m.hue},${m.sat}%,${m.lit}%,${opacity}) 0%,transparent 70%)`,animationDuration:`${m.dur}s`,animationDelay:`${-m.delay}s`,'--drift':`${m.drift}px`}}/>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  FLOATING HEARTS — triggered by \u200C prefix before name
//  Renders a continuous stream of tiny hearts rising from text
// ═══════════════════════════════════════════════════════════════

// The magic trigger character: Zero-Width Non-Joiner \u200C
// Usage in CONFIG.childName: "\u200CТогтуун"
const HEART_TRIGGER = '\u200C';

// Strips the trigger char from display text
function stripTrigger(text) {
  return text ? text.replace(HEART_TRIGGER, '') : text;
}

// Checks if a name starts with the trigger — works for both CONFIG and URL params
function hasHeartTrigger(name) {
  if (!name) return false;
  // Check for \u200C directly or its URL-encoded form
  return name.startsWith(HEART_TRIGGER) || name.startsWith('\u200C');
}

// Heart colours — warm rose, pink, with golden glow so they read as warm light
const HEART_COLORS = ['#FF6B8A','#FF8FAB','#FFB6C1','#FF4D6D','#FF85A1','#FC5C7D','#FF9EBC','#E75480'];

function FloatingHearts({ active }) {
  const hearts = useMemo(() => [...Array(12)].map((_, i) => {
    const seed = i * 37 + 13;
    const r = n => ((seed * n) % 1000) / 1000;
    return {
      id: i,
      size: 24 + r(3) * 18,          // 24–42px — big and visible
      color: HEART_COLORS[i % HEART_COLORS.length],
      leftPct: 2 + r(7) * 96,        // spread across name width
      hy: -(55 + r(11) * 45),        // rise 55–100px upward
      hx: (r(13) - 0.5) * 20,       // slight horizontal drift
      dur: 1.8 + r(17) * 1.8,
      delay: r(19) * 3.6,
    };
  }), []);

  if (!active) return null;
  return (
    <>
      {hearts.map(h => (
        <span
          key={h.id}
          className="floating-heart"
          aria-hidden="true"
          style={{
            fontSize: `${h.size}px`,
            color: h.color,
            left: `${h.leftPct}%`,
            top: '-6px',
            '--hx': `${h.hx}px`,
            '--hy': `${h.hy}px`,
            '--hd': `${h.dur}s`,
            '--hdelay': `${h.delay}s`,
            filter: `drop-shadow(0 0 ${Math.round(h.size * 0.6)}px ${h.color}) drop-shadow(0 0 ${Math.round(h.size * 1.2)}px #FF6B8A88)`,
          }}
        >♥</span>
      ))}
    </>
  );
}

// Splits line so hearts anchor ONLY over the name word, not the whole line.
// The \u200C marks the name start; we find the next space to isolate just the name.
function FarewellTextSegment({ text, isRevealed, showHearts }) {
  const triggerIdx = text.indexOf(HEART_TRIGGER);
  if (triggerIdx === -1) return <>{text}</>;

  const before = text.slice(0, triggerIdx);         // e.g. "«Эрхэм "
  const afterTrigger = text.slice(triggerIdx + 1);  // e.g. "Тогтуун минь ..."
  // Isolate just the name (up to first space)
  const spaceIdx = afterTrigger.indexOf(' ');
  const namePart   = spaceIdx === -1 ? afterTrigger : afterTrigger.slice(0, spaceIdx);
  const restOfLine = spaceIdx === -1 ? '' : afterTrigger.slice(spaceIdx);

  return (
    <>
      {before}
      <span className="heart-anchor" style={{whiteSpace:'nowrap'}}>
        {namePart}
        {isRevealed && <FloatingHearts active={showHearts}/>}
      </span>
      {restOfLine}
    </>
  );
}

  const [fadingOut, setFadingOut] = useState(false);

  const lines = useMemo(() => [

    { text: 'төгс тохирсон үзэсгэлэнтэй.', indent: 1, quote: true },
    { text: 'Өнөөдөр амьтад чиний ямар онцгойг ярьж өглөө,', indent: 0, quote: true },
    { text: `Маргааш чи бүр ч илүү гайхалтай болно\u201D.`, indent: 1, quote: true },
  ], [rawName, animal]);

  useEffect(() => {
    if (revealed < lines.length) {
      const t = setTimeout(() => setRevealed(r => r + 1), lines[revealed]?.gap ? 900 : 2400);
      return () => clearTimeout(t);
    } else {
      const t = setTimeout(() => setShowContinue(true), 1800);
      return () => clearTimeout(t);
    }
  }, [revealed, lines.length]);

  const handleContinue = () => {
    setFadingOut(true);
    setTimeout(() => onContinue(), 1500);
  };

  return (
    <>
      <div className="finale-stage finale-farewell">
        <div className="farewell-bg-fallback"/>
        <div className="farewell-bg-img"/>
        <div className="farewell-grain"/>
        {/* Atmosphere — petals, sparkles, tiny dots only. No bokeh blobs. */}
        <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:1}}>
          <Motes count={pc(16)} hue={30} opacity={.35} hues={[30,340,350,20,50]}/>
          <Petals hues={[340,20,350,30,60]} count={pc(14)}/>
          <TinyGlowDots count={pc(65)} hue={38} hueRange={18}/>
        </div>
        <div className="farewell-content">
          <div className="farewell-text-col">
            {lines.map((line, i) => {
              if (line.gap) return (
                <div key={i} className={`farewell-gap ${i < revealed ? 'is-in' : ''}`} style={{height:'18px'}}/>
              );
              const isIn = i < revealed;
              return (
                <p key={i} className={[
                  'farewell-line',
                  isIn ? 'is-in' : '',
                  line.indent ? 'is-indent' : '',
                  line.quote ? 'is-quote' : '',
                ].join(' ')}>
                  {line.hasHearts
                    ? <FarewellTextSegment
                        text={line.text}
                        isRevealed={isIn}
                        showHearts={isIn && hasHeartTrigger(rawName)}
                      />
                    : line.text
                  }
                </p>
              );
            })}
          </div>
          <div className="farewell-art-col">
            <img src={animalImg} alt={`${animal}`} className="farewell-art-img" draggable="false"/>
          </div>
        </div>
        <ContinueButton visible={showContinue && !fadingOut} onClick={handleContinue}/>
      </div>
      <div className={`farewell-fadeout ${fadingOut ? 'is-active' : ''}`}/>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
//  NIGHT FINALE — individual letter PNGs one by one on threads
// ═══════════════════════════════════════════════════════════════
function NightFinale({ childName, nameArt, gender, variantOverrides={}, onComplete }) {
  const videoRef=useRef(null);
  const [stage,setStage]=useState('video');
  const [lettersDropped,setLettersDropped]=useState(0);
  const [showFinishBtn,setShowFinishBtn]=useState(false);
  const [showEnding,setShowEnding]=useState(false);

  const name = cleanName(childName) || 'Тогтуун';
  const sleepingImg = gender === 'girl' ? 'assets/sleeping-girl.png' : 'assets/sleeping-boy.png';

  // Build letter slots — hyphens stripped, each slot knows if it's a segment-start (capital)
  const letterSlots = useMemo(() => buildLetterUrls(name, variantOverrides), [name, variantOverrides]);
  const letterCount = letterSlots.length; // includes hyphens — used for personalities/drop timing

  // Measure every PNG (glyph box + thread). Usually already done — App preloads them.
  const [metrics,setMetrics]=useState(null);
  useEffect(()=>{
    let alive=true;
    const done=list=>{ if(alive) setMetrics(m=>m||list); };
    Promise.all(letterSlots.map(s=>analyzeLetter(s.urls))).then(done);
    // Never hold the finale hostage to a slow network — fall back after 6s
    const t=setTimeout(()=>done(letterSlots.map(()=>null)),6000);
    return()=>{alive=false;clearTimeout(t);};
  },[letterSlots]);

  // Available space: screen width + the letter-row's height (set per device in CSS)
  const rowRef=useRef(null);
  const [box,setBox]=useState({w:window.innerWidth,h:window.innerHeight*0.46});
  useEffect(()=>{
    const measure=()=>{
      const el=rowRef.current;
      setBox({w:el?.clientWidth||window.innerWidth,h:el?.clientHeight||window.innerHeight*0.46});
    };
    measure();
    window.addEventListener('resize',measure);
    window.addEventListener('orientationchange',measure);
    return()=>{window.removeEventListener('resize',measure);window.removeEventListener('orientationchange',measure);};
  },[]);

  const layout = useMemo(
    ()=> metrics ? layoutLetters(letterSlots, metrics, box.w, box.h) : null,
    [metrics, letterSlots, box]
  );

  // Each letter: gentle pendulum sway, slow and organic
  const letterPersonalities=useMemo(()=>
    [...Array(letterCount)].map((_,i)=>({
      swayAmp: 1.2 + (i % 3) * 0.6 + Math.abs(Math.sin(i * 1.7)) * 0.4,  // 1.2–2.2deg
      swayDur: 7 + (i % 5) * 1.8 + Math.cos(i * 0.8) * 0.9,               // 7–13s
      dropDur: 1.3 + (i % 3) * 0.12,
    }))
  ,[letterCount]);

  // Freeze video — hold on a frame that still shows clouds (2s before end)
  useEffect(()=>{
    const v=videoRef.current;
    if(!v){setStage('frozen');return;}
    const FREEZE_BEFORE_END = 5.0; // seconds before end to freeze — keeps clouds visible
    const freeze=()=>{
      if(stage!=='video')return;
      try{
        if(v.duration&&isFinite(v.duration)){
          // Seek to a frame 2.2s before end so clouds are still present
          v.currentTime=Math.max(0,v.duration-FREEZE_BEFORE_END);
        }
        v.pause();
      }catch(e){}
      setStage('frozen');
    };
    v.addEventListener('ended',freeze);
    v.addEventListener('timeupdate',()=>{
      if(v.duration&&isFinite(v.duration)&&v.currentTime>=v.duration-FREEZE_BEFORE_END-0.1) freeze();
    });
    v.addEventListener('error',()=>setStage('frozen'));
    const failsafe=setTimeout(()=>{if(stage==='video')setStage('frozen');},32000);
    return()=>clearTimeout(failsafe);
  },[]);

  // Whoosh loop — starts immediately when video mounts, first shot is early
  // so it aligns with the first cloud movement in the video
  useEffect(()=>{
    let running = true;
    // First whoosh very soon (0.8s) to catch the first cloud sweep
    const first = setTimeout(()=>{
      if(running) window.MagicAudio?.playWhoosh?.();
    }, 800);
    // Then keep firing at intervals that feel like cloud passes
    function fire() {
      if(!running) return;
      window.MagicAudio?.playWhoosh?.();
      setTimeout(fire, 5000 + Math.random() * 5000); // 5–10s intervals
    }
    const loop = setTimeout(fire, 5500); // second whoosh ~5.5s in
    return ()=>{
      running = false;
      clearTimeout(first);
      clearTimeout(loop);
    };
  },[]);

  // When frozen: drop letters one by one
  useEffect(()=>{
    if(stage!=='frozen'||!layout)return;   // wait until letters are measured
    const timers=[];
    for(let i=0;i<letterCount;i++){
      timers.push(setTimeout(()=>setLettersDropped(n=>n+1), 800 + i*550));
    }
    timers.push(setTimeout(()=>setShowFinishBtn(true), 800 + letterCount*550 + 8000));
    return()=>timers.forEach(clearTimeout);
  },[stage,letterCount,!!layout]);

  // Дуусгах → pixie dust explosion → ending
  const handleFinish=useCallback((e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    setShowFinishBtn(false);
    spawnPixieDust(cx, cy, ()=>setShowEnding(true));
  },[]);

  return(
    <div className={`finale-night stage-${stage} finale-stage ${showEnding?'is-ending':''}`}>
      <video ref={videoRef} className="finale-night-video" src="assets/night-scene.mp4" autoPlay muted playsInline preload="auto"/>

      {/* Night atmosphere over video — stars + sparkles + fireflies, NO bokeh blobs */}
      <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:2}}>
        <Stars count={pc(90)}/>
        <NightSparkles count={pc(24)}/>
        <TinyGlowDots count={pc(60)} hue={220} hueRange={40}/>
        <Fireflies count={pc(10)} hue={52}/>
      </div>

      {/* Individual letters — one PNG per letter/hyphen, each on its own thread */}
      <div ref={rowRef} className="letter-row" style={{gap:layout?`${layout.gap}px`:0}}>
        {layout && letterSlots.map((slot, i)=>{
          const p=letterPersonalities[i];
          const it=layout.items[i];
          const dropped=i<lettersDropped;
          const swayStart=p.dropDur+0.2;
          return(
            <div
              key={i}
              className={`letter-slot ${dropped?'is-dropped':''}`}
              style={{
                width:`${it.glyphW}px`,
                height:`${it.glyphH}px`,
                marginBottom:`${it.lift}px`,
                transformOrigin:`${it.threadX}px ${it.pivotY}px`,  // swing from the sky, above the thread
                '--drop-from':`${-(box.h + it.glyphH)}px`,
                '--ld-dur':`${p.dropDur}s`,
                '--ld-delay':'0s',
                '--sw-dur':`${p.swayDur}s`,
                '--sw-start':`${swayStart}s`,
                '--sway-amp':`${Math.min(slot.isHyphen ? 1 : p.swayAmp, it.maxAmpDeg)}deg`,
              }}
            >
              {it.thread && (
                <span className="letter-thread" aria-hidden="true" style={{
                  left:`${it.thread.x - it.thread.w/2}px`,
                  width:`${it.thread.w}px`,
                  top:`calc(${it.thread.bottom}px - 160vh)`,
                  background:it.thread.color,
                }}/>
              )}
              {it.img && (
                <img
                  src={it.img.src}
                  crossOrigin="anonymous"
                  alt={slot.char}
                  className="letter-img"
                  style={{width:`${it.img.w}px`,height:`${it.img.h}px`,left:`${it.img.left}px`,top:`${it.img.top}px`}}
                  draggable="false"
                  onError={e=>{ e.target.style.opacity='0'; }}
                />
              )}
            </div>
          );
        })}
      </div>

      {/* Sleeping boy */}
      <img src={sleepingImg} alt="" aria-hidden="true" className={`night-sleeping ${stage==='frozen'?'is-in':''}`} draggable="false" onError={e=>{e.target.style.display='none';}}/>

      {/* Дуусгах button */}
      <button className={`finish-btn ${showFinishBtn?'is-visible':''}`} onClick={handleFinish} aria-label="Дуусгах">
        <span>✦ Дуусгах</span>
      </button>

      {/* Ending */}
      <div className={`finale-ending ${showEnding?'is-visible':''}`}>
        <div className="finale-ending-glow"/>
        <img src="assets/logo_dark.png" alt="Amiya Publishing" className="finale-ending-logo" draggable="false"/>
        <p className="finale-ending-website">amiyapublishing.com вэбсайтаар зочилоорой</p>
        <p className="finale-ending-text">10 хоногийн дараа хэвлэсэн номоо хүлээн аваарай</p>
        <button className="finale-restart-btn" onClick={onComplete}>ДАХИН ЭХЛЭХ</button>
      </div>
    </div>
  );
}

      <div className="start-gate-glow"/>
      <div className="start-gate-content">
        <div className="start-gate-eyebrow">amiya publishing · шидэт ном</div>
        <div className="start-gate-name">{displayName}</div>
        <div className="start-gate-rule"/>
        <div className="start-gate-from">{fromName?`${fromName}`:'Шидэт түүх'}</div>
        <div className="start-gate-cta"><span className="start-gate-cta-icon">✦</span><span>Эхлэх</span></div>
      </div>

// ═══════════════════════════════════════════════════════════════
//  ROOT APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const cfg=useConfig();
  useEffect(()=>{
    buildLetterUrls(cleanName(cfg.childName)||'Тогтуун', cfg.variantOverrides||{}).forEach(sl=>analyzeLetter(sl.urls));
  },[cfg]);
  const [scene,setScene]=useState(cfg.sceneOverride||CONFIG.defaultScene);
  const [phase,setPhase]=useState('gate');
  const [audioOn,setAudioOn]=useState(true);
  const [showWorldContinue,setShowWorldContinue]=useState(false);

  useEffect(()=>{
    setShowWorldContinue(false);
    if(phase!=='world')return;
    const t=setTimeout(()=>setShowWorldContinue(true),CONFIG.continueDelaySec*1000);
    return()=>clearTimeout(t);
  },[phase]);

  useEffect(()=>{
    document.body.classList.toggle('scene-night',  scene==='night');
    document.body.classList.toggle('scene-morning',scene==='morning');
  },[scene]);

  const audioCue=useCallback(kind=>{
    if(!audioOn)return;
    if(kind==='chime')window.MagicAudio?.chime();
    if(kind==='sparkle')window.MagicAudio?.sparkle();
  },[audioOn]);

  useEffect(()=>{window.MagicAudio?.setMuted(!audioOn);},[audioOn]);

  const handleStart=()=>{
    setPhase('intro');
    // Always call startAmbient on user gesture — browser requires it
    // setMuted handles whether sound actually plays
    window.MagicAudio?.startAmbient();
  };
  const handleReplay=()=>{setPhase('intro');window.MagicAudio?.startAmbient();};

  return(
    <div className="app">
      <World scene={scene}/>
      <BookFrame bookId={cfg.bookId} visible={phase==='world'}/>
      <Signature childName={cfg.childName} fromName={cfg.fromName} visible={phase==='world'}/>
      {phase==='gate'&&<StartGate onStart={handleStart} childName={cfg.childName} fromName={cfg.fromName}/>}
      {phase==='intro'&&<Intro variant={cfg.intro} childName={cfg.childName} fromName={cfg.fromName} onComplete={()=>setPhase('world')} onAudioCue={audioCue}/>}
      {phase==='farewell-page'&&<FarewellPage childName={cfg.childName} animalName={cfg.animalName} gender={cfg.gender} onContinue={()=>setPhase('night-finale')}/>}
      {phase==='night-finale'&&<NightFinale childName={cfg.childName} nameArt={cfg.nameArt} gender={cfg.gender} variantOverrides={cfg.variantOverrides||{}} onComplete={handleReplay}/>}
      {phase==='world'&&<ContinueButton visible={showWorldContinue} onClick={()=>setPhase('farewell-page')}/>}
      {phase!=='gate'&&phase!=='farewell-page'&&phase!=='night-finale'&&<>
        <AudioToggle muted={!audioOn} onToggle={()=>setAudioOn(v=>!v)}/>
        <ReplayButton onClick={handleReplay} visible={phase==='world'}/>
        <SceneNavigator scene={scene} onScene={setScene} visible={phase==='world'}/>
      </>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('app'));
root.render(<App/>);
  </script>
  <!-- Embedded audio -->
  <audio id="bg-music" src="assets/magic_book_music.mp3" loop preload="auto" style="display:none"></audio>
  <audio id="whoosh-sfx" src="assets/whoosh.mp3" preload="auto" style="display:none"></audio>
  <script>
    window.MagicAudio = (function() {
      const music = document.getElementById('bg-music');
      const whoosh = document.getElementById('whoosh-sfx');
      let muted = false;
      let started = false;
      if (music) music.volume = 0.28;

      function startAmbient() {
        if (started || muted || !music) return;
        music.currentTime = 0;
        music.play().then(() => { started = true; }).catch(() => {});
      }
      function setMuted(m) {
        muted = m;
        if (music) music.muted = m;
        if (whoosh) whoosh.muted = m;
        if (!m && !started) startAmbient();
      }
      function chime() {}
      function sparkle() {}
      function playWhoosh() {
        if (muted || !whoosh) return;
        whoosh.currentTime = 0;
        whoosh.volume = 0.42;
        whoosh.play().catch(() => {});
      }
      function startWhooshLoop() {
        let running = true;
        function fire() {
          if (!running) return;
          playWhoosh();
          setTimeout(fire, 7000 + Math.random() * 9000);
        }
        setTimeout(fire, 2500);
        return () => { running = false; };
      }
      return { startAmbient, setMuted, chime, sparkle, playWhoosh, startWhooshLoop };
    })();
  </script>
</body>
